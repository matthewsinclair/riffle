name: CI

on:
  push:
    branches: [main]
    # A push that only moves a board starts no run (devbin#0110). Path filters
    # are not evaluated for pushes of tags, so this cannot suppress a release.
    paths-ignore:
      - 'intent/whiteboard/**'
  pull_request:

# SUPERSEDED RUNS ARE CANCELLED (hv's ruling of 2026-09-21; devbin#0108 carries
# the reasoning). The EVENT is part of the key because a push and an on-demand
# run share a ref, and a group keyed on the ref alone lets each cancel the
# other. GitHub already replaces a PENDING run in the group; cancel-in-progress
# adds the one that is RUNNING, which is where the minutes are.
#
# There is no tag trigger here, deliberately: the tag trigger exists so a macOS
# leg can run on a release, and this repository has no macOS job. Adding one
# would start runs the ruling never asked for.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.20.3"
          otp-version: "29"

      - uses: actions/cache@v6
        with:
          path: |
            deps
            _build
          key: mix-${{ runner.os }}-${{ hashFiles('mix.lock') }}
          restore-keys: mix-${{ runner.os }}-

      - run: mix deps.get
      - run: mix gate
