name: CI

on:
  push:
    branches: [main]
    # A push that only moves a board starts no run (devbin#0110). Path filters
    # are not evaluated for pushes of tags, so this cannot suppress a release.
    paths-ignore:
      - 'intent/whiteboard/**'
      # BOTH PATHS OR NEITHER (devbin#0110): GitHub skips a push only when EVERY
      # changed path matches, and `intent wb` writes a canon event beside the
      # board view it renders -- so the whiteboard line ALONE suppresses nothing
      # a node actually does. Justified by what no job READS, not by a hit rate:
      # no job here opens either tree, and that stays true as habits change.
      - 'intent/.canon/**'
  pull_request:

# SUPERSEDED RUNS ARE CANCELLED (hv's ruling of 2026-09-21; devbin#0108 carries
# the reasoning). The EVENT is part of the key because that is the spelling the
# whole fleet shares. Where a workflow HAS a dispatch or a schedule trigger, a
# push and an on-demand run share a ref, so a group keyed on the ref alone lets
# each cancel the other. THIS workflow has neither -- its only triggers are push
# and pull_request, checked in this file -- so that hazard is the fleet's reason
# for the spelling rather than ours. GitHub already replaces a PENDING run in
# the group; cancel-in-progress adds the one that is RUNNING, which is where the
# minutes are.
#
# The earlier wording asserted the dispatch hazard as this repository's own,
# which would tell a later reader we have on-demand runs here. Caught at Laksa
# by laksa/dc, 2026-09-22, and swept to every estate the same sentence reached.
#
# There is no tag trigger here, deliberately: the tag trigger exists so a macOS
# leg can run on a release, and this repository has no macOS job. Adding one
# would start runs the ruling never asked for.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.20.3"
          otp-version: "29"

      - uses: actions/cache@v6
        with:
          path: |
            deps
            _build
          key: mix-${{ runner.os }}-${{ hashFiles('mix.lock') }}
          restore-keys: mix-${{ runner.os }}-

      - run: mix deps.get
      - run: mix gate
